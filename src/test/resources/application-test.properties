# ===========================================================================
# HFDC Bank - test profile
# The automated tests run against an in-memory H2 database in MySQL mode.
# Production and local development always use MySQL 8 (see application.properties).
# ===========================================================================

spring.datasource.url=jdbc:h2:mem:hfdcbank;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.minimum-idle=4

# Create the H2-compatible schema before the context finishes starting.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.continue-on-error=false

jwt.secret=test-only-hfdc-bank-jwt-secret-0123456789abcdef
jwt.expiration-ms=3600000

hfdc.cors.allowed-origins=http://localhost:5173
hfdc.cookie.secure=false
hfdc.cookie.same-site=lax
hfdc.dev-mode=true

logging.level.root=warn
logging.level.com.hfdcbank=warn
spring.main.banner-mode=off

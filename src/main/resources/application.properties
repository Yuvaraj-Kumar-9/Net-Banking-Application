# ===========================================================================
# HFDC Bank - Spring Boot configuration
# Every value can be overridden with an environment variable, which is how the
# application is configured on a cloud host. Defaults are for LOCAL DEV ONLY.
# ===========================================================================

spring.application.name=HFDC Bank
server.port=${PORT:8080}
server.servlet.context-path=/

# ----------------------------------------------------------------- Database --
# Local default points at the standard MySQL 8 installation. The bundled dev
# scripts set DB_URL/DB_USER/DB_PASSWORD to use the isolated port-33306 instance.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/hfdc_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------- JSON ---
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false

# -------------------------------------------------------------- Security ----
# There is deliberately NO working default: production and local runs must set
# a JWT_SECRET of at least 32 bytes. JwtService fails fast otherwise.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

hfdc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
hfdc.cookie.secure=${COOKIE_SECURE:false}
hfdc.cookie.same-site=${COOKIE_SAME_SITE:lax}
# Dev mode reveals the password-reset token on screen so the flow can be tested
# without an email server. MUST be false in production.
hfdc.dev-mode=${DEV_MODE:true}

# --------------------------------------------------------------- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ------------------------------------------------------------------ Logs ----
# Never log request bodies: they contain passwords and transaction PINs.
logging.level.com.hfdcbank=info
logging.level.org.springframework.security=warn
server.error.include-message=never
server.error.include-stacktrace=never
